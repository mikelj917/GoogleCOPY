<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoogleCOPY</title>
    <link rel="icon" href="./assets/images/google.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/src/styles/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="" class="nav-link">Gmail</a>
            <a href="" class="nav-link">Imagens</a>
            <div class="google-apps-icon">
                <i class="fa-solid fa-ellipsis-vertical"></i>
                <i class="fa-solid fa-ellipsis-vertical"></i>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
            <div class="user-img">
                <img src="/assets/images/user-icon.jpg" alt="Foto do usuário">
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <img src="./assets/images/googlelogo_light_color_272x92dp.png" alt="">
            <div class="input-box">
                <input type="search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="buttons">
                <button>Pesquisa Google</button>
                <button>Estou com sorte</button>
            </div>
        </div>
    </main>
    <footer>
        <div class="top-side">
            <p>Brasil</p>
        </div>
        <hr>
        <div class="bottom-side">
            <div class="left-side">
                <a href="">Sobre</a>
                <a href="">Publicidade</a>
                <a href="">Negócios</a>
                <a href="">Como funciona a Pesquisa</a>
            </div>
            <div class="right-side">
                <a href="">Privacidade</a>
                <a href="">Termos</a>
                <a href="">Configurações</a>
            </div>
        </div>
    </footer>

</html>
